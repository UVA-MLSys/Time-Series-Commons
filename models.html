<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Models & Datasets - Time Series Commons</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Google+Sans+Text:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/styles.css">
    <style>
        :root {
            /* Google NotebookLM Colors */
            --nlm-blue-50: #4259ff;
            --nlm-blue-98: #edeffa;
            --nlm-grey-10: #1b1b1c;
            --nlm-grey-20: #303030;
            --nlm-grey-40: #5e5e5e;
            --nlm-grey-50: #777;
            --nlm-grey-95: #f2f2f2;
            --nlm-grey-98: #f9f9f9;
            --nlm-brand-white: #fff;
            
            --v2-surface: #f7fbff;
            --v2-surface-container: #dce1e8;
            --v2-surface-container-high: #e3e8ee;
            --v2-on-surface: #47484c;
            --v2-on-surface-emphasis: #1f1f1f;
            --v2-on-surface-de-emphasis: #535559;
            --v2-primary: #abc8fa;
            --v2-divider: #d6dbe2;
            --v2-note-border: #dde1eb;
            
            --v3-pill-selected-background: #edeffa;
            --v3-follow-up-button-background: #dce1e8;
            
            /* Material Design Shadows */
            --mat-sys-level1: 0px 2px 1px -1px rgba(0, 0, 0, 0.2), 0px 1px 1px 0px rgba(0, 0, 0, 0.14), 0px 1px 3px 0px rgba(0, 0, 0, 0.12);
            --mat-sys-level2: 0px 3px 3px -2px rgba(0, 0, 0, 0.2), 0px 3px 4px 0px rgba(0, 0, 0, 0.14), 0px 1px 8px 0px rgba(0, 0, 0, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Google Sans Text', 'Google Sans', sans-serif;
            background-color: var(--v2-surface);
            color: var(--v2-on-surface-emphasis);
            line-height: 1.5;
        }

        /* Header */
        .nlm-header {
            background: var(--nlm-brand-white) !important;
            border-bottom: 1px solid var(--v2-note-border) !important;
            padding: 16px 24px !important;
            position: relative !important; /* Changed from sticky to relative */
            z-index: 99 !important;
            display: block !important; /* Force display */
            visibility: visible !important; /* Force visibility */
        }

        /* Adjust body to account for fixed navbar */
        body {
            padding-top: 70px; /* Use padding instead of margin */
        }

        .header-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .nav-tabs {
            display: flex;
            gap: 4px;
        }

        .nav-tab {
            padding: 8px 16px;
            border-radius: 20px;
            background: transparent;
            border: none;
            font-size: 14px;
            font-weight: 500;
            font-family: 'Google Sans Text', sans-serif;
            color: var(--v2-on-surface);
            cursor: pointer;
            transition: all 0.2s;
        }

        .nav-tab:hover {
            background: var(--nlm-grey-95);
        }

        .nav-tab.active {
            background: var(--v3-pill-selected-background);
            color: var(--nlm-blue-50);
        }

        .header-center {
            flex: 1;
            max-width: 600px;
        }

        .search-bar {
            display: flex;
            align-items: center;
            background: var(--nlm-grey-95);
            border-radius: 24px;
            padding: 8px 16px;
            gap: 8px;
            border: 1px solid transparent;
            transition: all 0.2s;
        }

        .search-bar:focus-within {
            background: var(--nlm-brand-white);
            border-color: var(--v2-note-border);
            box-shadow: var(--mat-sys-level1);
        }

        .search-bar input {
            flex: 1;
            border: none;
            background: transparent;
            outline: none;
            font-size: 14px;
            font-family: 'Google Sans Text', sans-serif;
            color: var(--v2-on-surface-emphasis);
        }

        .search-bar input::placeholder {
            color: var(--v2-on-surface-de-emphasis);
        }

        .search-icon {
            width: 20px;
            height: 20px;
            color: var(--v2-on-surface-de-emphasis);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .view-controls {
            display: flex;
            align-items: center;
            gap: 4px;
            background: var(--nlm-grey-95);
            border-radius: 20px;
            padding: 4px;
        }

        .view-btn {
            padding: 6px 12px;
            border: none;
            background: transparent;
            border-radius: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
            font-family: 'Google Sans Text', sans-serif;
            font-size: 13px;
            font-weight: 500;
            color: var(--v2-on-surface);
        }

        .view-btn:hover {
            background: var(--nlm-brand-white);
        }

        .view-btn.active {
            background: var(--nlm-brand-white);
            color: var(--nlm-blue-50);
            box-shadow: var(--mat-sys-level1);
        }

        .view-btn svg {
            width: 16px;
            height: 16px;
        }

        .sort-dropdown {
            padding: 8px 12px;
            border: 1px solid var(--v2-note-border);
            border-radius: 20px;
            background: var(--nlm-brand-white);
            font-size: 13px;
            font-family: 'Google Sans Text', sans-serif;
            color: var(--v2-on-surface-emphasis);
            cursor: pointer;
            outline: none;
        }

        /* Main Content */
        .main-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 32px 24px;
        }

        /* Section */
        .section {
            margin-bottom: 48px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 22px;
            font-weight: 400;
            font-family: 'Google Sans', sans-serif;
            color: var(--v2-on-surface-emphasis);
        }

        .see-all-btn {
            padding: 8px 16px;
            background: transparent;
            border: none;
            color: var(--nlm-blue-50);
            font-size: 14px;
            font-weight: 500;
            font-family: 'Google Sans Text', sans-serif;
            cursor: pointer;
            border-radius: 20px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .see-all-btn:hover {
            background: var(--nlm-grey-95);
        }

        .see-all-btn svg {
            width: 16px;
            height: 16px;
        }

        /* Card Grid */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .featured-cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
        }

        /* Card */
        .card {
            background: var(--nlm-brand-white);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--mat-sys-level1);
            transition: all 0.2s;
            cursor: pointer;
            border: 1px solid var(--v2-note-border);
        }

        .card:hover {
            box-shadow: var(--mat-sys-level2);
        }

        .card-image {
            width: 100%;
            height: 140px;
            background: var(--nlm-blue-98);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .card-image.dataset-bg {
            background: var(--nlm-blue-98);
        }

        .card-image.model-bg {
            background: var(--v3-follow-up-button-background);
        }

        .card-icon {
            font-size: 40px;
            opacity: 0.6;
        }

        .card-meta {
            position: absolute;
            top: 12px;
            left: 12px;
        }

        .meta-badge {
            padding: 4px 12px;
            background: var(--nlm-brand-white);
            border-radius: 16px;
            font-size: 12px;
            font-weight: 500;
            font-family: 'Google Sans Text', sans-serif;
            color: var(--v2-on-surface);
            box-shadow: var(--mat-sys-level1);
        }

        .card-content {
            padding: 16px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 500;
            font-family: 'Google Sans', sans-serif;
            color: var(--v2-on-surface-emphasis);
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .card-description {
            font-size: 13px;
            font-family: 'Google Sans Text', sans-serif;
            color: var(--v2-on-surface);
            line-height: 1.5;
            min-height: 40px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* List View */
        /* Featured Cards Grid (always visible) */
        .featured-cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .cards-grid {
            display: none;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .cards-grid.active {
            display: grid;
        }

        .list-view {
            display: none;
            flex-direction: column;
            gap: 8px;
        }

        .list-view.active {
            display: flex;
        }

        .list-item {
            background: var(--nlm-brand-white);
            border-radius: 8px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid var(--v2-note-border);
            cursor: pointer;
            transition: all 0.2s;
        }

        .list-item:hover {
            box-shadow: var(--mat-sys-level1);
        }

        .list-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--nlm-blue-98);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .list-content {
            flex: 1;
        }

        .list-title {
            font-size: 14px;
            font-weight: 500;
            font-family: 'Google Sans', sans-serif;
            color: var(--v2-on-surface-emphasis);
            margin-bottom: 2px;
        }

        .list-meta {
            font-size: 12px;
            font-family: 'Google Sans Text', sans-serif;
            color: var(--v2-on-surface-de-emphasis);
        }

        .list-badge {
            padding: 4px 12px;
            background: var(--nlm-blue-98);
            border-radius: 12px;
            font-size: 12px;
            font-family: 'Google Sans Text', sans-serif;
            color: var(--nlm-blue-50);
            font-weight: 500;
        }

        /* Hidden state */
        .hidden {
            display: none !important;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 64px 24px;
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.4;
        }

        .empty-title {
            font-size: 18px;
            font-weight: 500;
            font-family: 'Google Sans', sans-serif;
            color: var(--v2-on-surface-emphasis);
            margin-bottom: 8px;
        }

        .empty-description {
            font-size: 14px;
            font-family: 'Google Sans Text', sans-serif;
            color: var(--v2-on-surface-de-emphasis);
        }

        /* Modal Styles (NotebookLM-inspired) */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            opacity: 0;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(4px);
        }

        .modal-overlay.active {
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 1;
        }

        .modal-content {
            background: var(--nlm-brand-white);
            border-radius: 16px;
            max-width: 800px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            transform: scale(0.95);
            transition: transform 0.3s ease;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-header {
            padding: 24px 28px;
            border-bottom: 1px solid var(--v2-note-border);
            position: sticky;
            top: 0;
            background: var(--nlm-brand-white);
            z-index: 10;
        }

        .modal-header h2 {
            color: var(--v2-on-surface-emphasis);
            font-size: 24px;
            font-weight: 500;
            font-family: 'Google Sans', sans-serif;
            margin: 0;
            padding-right: 40px;
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 36px;
            height: 36px;
            border: none;
            background: var(--nlm-grey-95);
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            color: var(--v2-on-surface);
        }

        .modal-close:hover {
            background: var(--nlm-blue-50);
            color: var(--nlm-brand-white);
        }

        .modal-body {
            padding: 28px;
        }

        .modal-section {
            margin-bottom: 28px;
        }

        .modal-section:last-child {
            margin-bottom: 0;
        }

        .modal-section h3 {
            color: var(--v2-on-surface-emphasis);
            font-size: 18px;
            font-weight: 500;
            font-family: 'Google Sans', sans-serif;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--v2-note-border);
        }

        .modal-description,
        .model-description-text {
            font-size: 14px;
            font-family: 'Google Sans Text', sans-serif;
            color: var(--v2-on-surface);
            line-height: 1.6;
            margin: 0;
        }

        .modal-info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-top: 12px;
        }

        .modal-info-item {
            padding: 16px;
            background-color: var(--nlm-blue-98);
            border-radius: 12px;
            border: 1px solid var(--v2-note-border);
        }

        .modal-info-label {
            font-weight: 500;
            color: var(--v2-on-surface-de-emphasis);
            font-size: 12px;
            font-family: 'Google Sans Text', sans-serif;
            display: block;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .modal-info-value {
            color: var(--v2-on-surface-emphasis);
            font-size: 16px;
            font-weight: 500;
            font-family: 'Google Sans', sans-serif;
        }

        .modal-links {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .modal-link {
            display: inline-flex;
            align-items: center;
            padding: 10px 20px;
            background-color: var(--nlm-blue-50);
            color: var(--nlm-brand-white);
            border-radius: 20px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            font-family: 'Google Sans', sans-serif;
            transition: all 0.2s ease;
        }

        .modal-link:hover {
            background-color: var(--nlm-grey-10);
            transform: translateY(-1px);
            box-shadow: var(--mat-sys-level2);
        }

        .benchmarks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 8px;
            margin-top: 12px;
        }

        .benchmark-badge {
            padding: 8px 12px;
            background-color: var(--nlm-blue-98);
            color: var(--nlm-blue-50);
            border-radius: 8px;
            text-align: center;
            font-size: 13px;
            font-weight: 500;
            font-family: 'Google Sans Text', sans-serif;
            border: 1px solid var(--v2-note-border);
        }

        .benchmark-badge.inactive {
            background-color: var(--nlm-grey-95);
            color: var(--v2-on-surface-de-emphasis);
        }

        .model-stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-top: 12px;
        }

        .model-stat-card {
            background: linear-gradient(135deg, var(--nlm-blue-50) 0%, var(--nlm-blue-98) 100%);
            padding: 24px;
            border-radius: 12px;
            text-align: center;
            color: var(--nlm-brand-white);
            box-shadow: var(--mat-sys-level1);
        }

        .stat-number {
            font-size: 36px;
            font-weight: 700;
            font-family: 'Google Sans', sans-serif;
            margin-bottom: 8px;
            color: var(--v2-on-surface-emphasis);
        }

        .stat-label {
            font-size: 12px;
            font-family: 'Google Sans Text', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--v2-on-surface);
        }

        .sample-datasets-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 12px;
        }

        .sample-dataset-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: var(--nlm-blue-98);
            border-radius: 8px;
            border-left: 4px solid var(--nlm-blue-50);
            font-size: 14px;
            font-family: 'Google Sans Text', sans-serif;
        }

        .sample-dataset-item strong {
            flex: 1;
            color: var(--v2-on-surface-emphasis);
            font-weight: 500;
        }

        .dataset-domain-tag {
            padding: 4px 12px;
            background-color: var(--nlm-brand-white);
            color: var(--nlm-blue-50);
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
            border: 1px solid var(--v2-note-border);
        }

        .more-datasets {
            font-style: italic;
            color: var(--v2-on-surface-de-emphasis);
            margin-top: 8px;
            text-align: center;
            font-size: 13px;
            font-family: 'Google Sans Text', sans-serif;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header-container {
                flex-direction: column;
                align-items: stretch;
            }

            .header-left,
            .header-center,
            .header-right {
                width: 100%;
            }

            .nav-tabs {
                overflow-x: auto;
            }

            .cards-grid,
            .featured-cards-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Main Navigation Bar -->
    <div class="navbar">
        <div class="logo">
            <img src="./pics/img/UVAdatascience.png" alt="Data Science Logo">
        </div>
        <div class="navbar-links">
            <a href="index.html"><b>Home</b></a>
            <a href="models.html"><b>Models</b></a>
            <a href="index.html#contributors"><b>Contributors</b></a>
            <a href="projects.html"><b>Projects</b></a>
            <a href="publications.html"><b>Publications</b></a>
            <a href="awards.html"><b>Awards</b></a>
        </div>
    </div>

    <!-- NotebookLM-Style Header -->
    <header class="nlm-header">
        <div class="header-container">
            <div class="header-left">
                <div class="nav-tabs">
                    <button class="nav-tab active" data-tab="all">All</button>
                    <button class="nav-tab" data-tab="datasets">Datasets</button>
                    <button class="nav-tab" data-tab="models">Models</button>
                </div>
            </div>
            
            <div class="header-center">
                <div class="search-bar">
                    <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                    <input type="text" id="search-input" placeholder="Search datasets and models...">
                </div>
            </div>
            
            <div class="header-right">
                <div class="view-controls">
                    <button class="view-btn" data-view="grid">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path>
                        </svg>
                    </button>
                    <button class="view-btn active" data-view="list">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                        </svg>
                    </button>
                </div>
                <select class="sort-dropdown" id="sort-select">
                    <option value="recent">Most recent</option>
                    <option value="name">Name</option>
                    <option value="domain">Domain</option>
                </select>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <!-- All View -->
        <div id="all-view">
            <!-- Featured Datasets -->
            <section class="section">
                <div class="section-header">
                    <h2 class="section-title">Featured datasets</h2>
                    <button class="see-all-btn" data-section="datasets">
                        See all
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                        </svg>
                    </button>
                </div>
                <div class="featured-cards-grid" id="featured-datasets-grid"></div>
            </section>

            <!-- Featured Models -->
            <section class="section">
                <div class="section-header">
                    <h2 class="section-title">Featured models</h2>
                    <button class="see-all-btn" data-section="models">
                        See all
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                        </svg>
                    </button>
                </div>
                <div class="featured-cards-grid" id="featured-models-grid"></div>
            </section>
        </div>

        <!-- Datasets View -->
        <div id="datasets-view" class="hidden">
            <section class="section">
                <div class="section-header">
                    <h2 class="section-title">All Datasets</h2>
                    <span id="datasets-count" style="color: var(--v2-on-surface-de-emphasis); font-size: 14px; font-family: 'Google Sans Text', sans-serif;"></span>
                </div>
                <div class="cards-grid" id="all-datasets-grid"></div>
                <div class="list-view" id="all-datasets-list"></div>
            </section>
        </div>

        <!-- Models View -->
        <div id="models-view" class="hidden">
            <section class="section">
                <div class="section-header">
                    <h2 class="section-title">All Models</h2>
                    <span id="models-count" style="color: var(--v2-on-surface-de-emphasis); font-size: 14px; font-family: 'Google Sans Text', sans-serif;"></span>
                </div>
                <div class="cards-grid" id="all-models-grid"></div>
                <div class="list-view" id="all-models-list"></div>
            </section>
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="empty-state hidden">
            <div class="empty-icon">🔍</div>
            <div class="empty-title">No results found</div>
            <div class="empty-description">Try adjusting your search or filters</div>
        </div>
    </main>

    <!-- Modal Overlay -->
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title"></h2>
                <button id="modal-close" class="modal-close" aria-label="Close modal">&times;</button>
            </div>
            <div id="modal-body" class="modal-body"></div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="./js/models.js"></script>
</body>
</html>
